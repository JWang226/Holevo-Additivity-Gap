name: Full release verification

on:
  push:
    branches: ['codex/release-*']
    paths:
      - '.github/workflows/release-verify.yml'
      - 'Nonadditivity/**'
      - '*.lean'
      - 'metadata/results.json'
      - 'verification/check_reports.py'
      - 'verification/check_statement_audit.py'
      - 'verification/statement-audit-20261007/record_checks.py'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install metadata dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Run evidence validation controls
        run: |
          python scripts/test_check_reports.py
          python scripts/test_statement_audit.py
          python scripts/validate_release.py --static-only --source-certificate verification/elaboration-20261006/source-certificate.json
      - name: Install pinned Lean and cached dependencies
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Rebuild and audit Lean, compare statements, replay Lean, and check Nanoda
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .verify-work
          bash scripts/verify.sh all --source-certificate verification/elaboration-20261006/source-certificate.json 2>&1 | tee .verify-work/all-release.log
      - name: Retain successful portable evidence
        run: python scripts/archive_verification.py --full-log .verify-work/all-release.log
      - name: Check the declaration export and record current statement applications
        run: |
          python scripts/export_declarations.py --check
          python verification/statement-audit-20261007/record_checks.py --source-commit "$GITHUB_SHA"
          python verification/check_reports.py
          python verification/check_statement_audit.py
      - name: Generate and check release website
        run: |
          python tools/docs-site/build.py
          python tools/docs-site/build.py --check
      - name: Preserve current evidence and failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-verification
          include-hidden-files: true
          retention-days: 30
          path: |
            verification/portable-20261007/
            verification/statement-audit-20261007/
            verification/statement-audit-delta-20261007.json
            verification/statement-audit-current.json
            .verify-work/all-release.log
            .verify-work/run-*/*.json
            .verify-work/run-*/*.log
            .verify-work/run-*/result.txt
            .lake/export-declarations.log
            .lake/check.log
          if-no-files-found: warn
