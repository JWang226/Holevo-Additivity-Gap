name: Proof documentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs.yml'
      - 'tools/docs-site/**'
      - 'html/**'
      - 'README.md'
      - 'PROOF-PATH.md'
      - 'docs/**'
      - 'metadata/**'
      - 'formalization.yaml'
      - 'verification/**'
      - 'ComparatorChallenges/**'
      - 'Nonadditivity/**'
      - '*.lean'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proof-documentation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Generate and check the offline proof browser
        run: |
          python tools/docs-site/build.py
          python tools/docs-site/build.py --check
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload generated documentation
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: html

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the proof browser
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
