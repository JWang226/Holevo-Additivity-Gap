name: Lean and release metadata

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install metadata validator dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Check release structure and baseline source integrity
        run: python scripts/validate_release.py --static-only --source-certificate verification/elaboration-20261006/source-certificate.json
      - name: Install pinned Lean toolchain and dependency cache
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Compile every proof module and audit transitive axioms
        run: ./check.sh
      - name: Check metadata declarations in the compiled Lean environment
        run: python scripts/validate_release.py --source-certificate verification/elaboration-20261006/source-certificate.json
      - name: Elaborate challenge statements and check the actual proof types
        run: python scripts/check_challenges.py
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lean-verification
          include-hidden-files: true
          path: |
            .lake/check.log
            .lake/release-declarations.log
            .lake/release-validation.json
            .lake/challenge-checks.json
            .lake/challenge-checks/*.log
          if-no-files-found: warn

# Comparator/Lean replay and Nanoda are independently reproducible via scripts/verify.sh.
# This workflow does not publish releases or claim a Comparator result.
